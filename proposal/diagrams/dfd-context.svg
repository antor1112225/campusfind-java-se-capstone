<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F4E79" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" />

  <!-- Diagram Title -->
  <text x="425" y="36" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">
    Data Flow Diagram (DFD) — Level 0 Context Diagram
  </text>
  <text x="425" y="58" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">
    System Boundary, External Entities, and Core Information Flows
  </text>

  <!-- External Entity 1: Campus User -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    <rect width="210" height="150" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <rect width="210" height="34" rx="8" fill="#DBEAFE" />
    <text x="105" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">
      [External Entity]
    </text>
    <text x="105" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E40AF" text-anchor="middle">
      Campus User
    </text>
    <text x="105" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3B82F6" text-anchor="middle">
      (Students, Faculty, Staff)
    </text>
    <line x1="20" y1="102" x2="190" y2="102" stroke="#BFDBFE" stroke-width="1"/>
    <text x="105" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
      Reports items, searches,
    </text>
    <text x="105" y="137" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
      and submits ownership claims
    </text>
  </g>

  <!-- Central Process: CampusFind System -->
  <g transform="translate(350, 150)" filter="url(#shadow)">
    <circle cx="75" cy="85" r="82" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
    <path d="M 0 65 L 150 65" stroke="#BAE6FD" stroke-width="1.5" />
    <text x="75" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#0369A1" text-anchor="middle">
      0.0
    </text>
    <text x="75" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#0C4A6E" text-anchor="middle">
      CampusFind
    </text>
    <text x="75" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0284C7" text-anchor="middle">
      Core System
    </text>
    <text x="75" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">
      Desktop Application
    </text>
  </g>

  <!-- External Entity 2: Administrator / Reviewer -->
  <g transform="translate(580, 160)" filter="url(#shadow)">
    <rect width="210" height="150" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" />
    <rect width="210" height="34" rx="8" fill="#FFEDD5" />
    <text x="105" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#9A3412" text-anchor="middle">
      [External Entity]
    </text>
    <text x="105" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#C2410C" text-anchor="middle">
      Campus Administrator
    </text>
    <text x="105" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#EA580C" text-anchor="middle">
      (Lost &amp; Found Reviewer)
    </text>
    <line x1="20" y1="102" x2="190" y2="102" stroke="#FED7AA" stroke-width="1"/>
    <text x="105" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
      Inspects private clues, reviews
    </text>
    <text x="105" y="137" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
      claims, accepts or rejects
    </text>
  </g>

  <!-- Data Flows: User -> System -->
  <path d="M 270 200 L 348 200" fill="none" stroke="#1F4E79" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="250" y="165" width="135" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="317" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E3A8A" text-anchor="middle">Item Reports &amp; Clues</text>
  <text x="317" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Claim Submissions</text>

  <!-- Data Flows: System -> User -->
  <path d="M 348 260 L 274 260" fill="none" stroke="#1F4E79" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="250" y="265" width="135" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="317" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E3A8A" text-anchor="middle">Public Listings (Clue Hidden)</text>
  <text x="317" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Claim Status &amp; Receipts</text>

  <!-- Data Flows: System -> Admin -->
  <path d="M 500 200 L 576 200" fill="none" stroke="#C2410C" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="475" y="165" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="545" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#9A3412" text-anchor="middle">Pending Claims Queue</text>
  <text x="545" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Founder Clue vs Claim Proof</text>

  <!-- Data Flows: Admin -> System -->
  <path d="M 576 260 L 504 260" fill="none" stroke="#C2410C" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="475" y="265" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="545" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#9A3412" text-anchor="middle">Review Decision (Accept/Reject)</text>
  <text x="545" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Admin Verification Remarks</text>

  <!-- Footer note -->
  <rect x="180" y="420" width="490" height="36" rx="6" fill="#F1F5F9" stroke="#E2E8F0" />
  <text x="425" y="442" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
    Security Policy: Private identifying clues are strictly routed to the Reviewer and never to the User entity.
  </text>
</svg>