<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F4E79" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#166534" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C2410C" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" />

  <!-- Diagram Header -->
  <text x="490" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">
    Data Flow Diagram (DFD) — Level 1 Decomposition
  </text>
  <text x="490" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">
    Detailed Sub-Processes, Internal Data Stores (D1, D2), and Verification Data Paths
  </text>

  <!-- External Entity: Campus User (Left) -->
  <g transform="translate(30, 160)" filter="url(#shadow)">
    <rect width="130" height="260" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <rect width="130" height="32" rx="8" fill="#DBEAFE" />
    <text x="65" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">[External Entity]</text>
    <text x="65" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">Campus User</text>
    <text x="65" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">(Student, Staff,</text>
    <text x="65" y="108" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Faculty)</text>
    <line x1="15" y1="125" x2="115" y2="125" stroke="#BFDBFE" stroke-width="1"/>
    <text x="65" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">• Report Item</text>
    <text x="65" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">• Search Catalog</text>
    <text x="65" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">• File Claim</text>
    <text x="65" y="216" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">• View Public List</text>
  </g>

  <!-- Process 1.0: Record Item -->
  <g transform="translate(240, 90)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" />
    <path d="M 5 36 L 95 36" stroke="#BAE6FD" stroke-width="1.2" />
    <text x="50" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">1.0</text>
    <text x="50" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Record</text>
    <text x="50" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Item</text>
  </g>

  <!-- Process 2.0: Browse & Search Items -->
  <g transform="translate(240, 240)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" />
    <path d="M 5 36 L 95 36" stroke="#BAE6FD" stroke-width="1.2" />
    <text x="50" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">2.0</text>
    <text x="50" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Browse &amp;</text>
    <text x="50" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Search Items</text>
  </g>

  <!-- Process 3.0: Submit Claim -->
  <g transform="translate(240, 400)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" />
    <path d="M 5 36 L 95 36" stroke="#BAE6FD" stroke-width="1.2" />
    <text x="50" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">3.0</text>
    <text x="50" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Submit</text>
    <text x="50" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Claim</text>
  </g>

  <!-- Data Store D1: Items Store (items.csv) -->
  <g transform="translate(430, 160)" filter="url(#shadow)">
    <rect width="160" height="58" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" />
    <line x1="38" y1="0" x2="38" y2="58" stroke="#16A34A" stroke-width="1.5" />
    <text x="19" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803D" text-anchor="middle">D1</text>
    <text x="98" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Items Data Store</text>
    <text x="98" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">(items.csv)</text>
  </g>

  <!-- Data Store D2: Claims Store (claims.csv) -->
  <g transform="translate(430, 390)" filter="url(#shadow)">
    <rect width="160" height="58" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" />
    <line x1="38" y1="0" x2="38" y2="58" stroke="#16A34A" stroke-width="1.5" />
    <text x="19" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803D" text-anchor="middle">D2</text>
    <text x="98" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Claims Data Store</text>
    <text x="98" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">(claims.csv)</text>
  </g>

  <!-- Process 4.0: Verify & Review Claims -->
  <g transform="translate(680, 240)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.5" />
    <path d="M 5 36 L 95 36" stroke="#FED7AA" stroke-width="1.2" />
    <text x="50" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#C2410C" text-anchor="middle">4.0</text>
    <text x="50" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Verify &amp;</text>
    <text x="50" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Review Claims</text>
  </g>

  <!-- Process 5.0: Resolve & Update -->
  <g transform="translate(680, 420)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5" />
    <path d="M 5 36 L 95 36" stroke="#BBF7D0" stroke-width="1.2" />
    <text x="50" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803D" text-anchor="middle">5.0</text>
    <text x="50" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Resolve &amp;</text>
    <text x="50" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Close Competing</text>
  </g>

  <!-- External Entity: Administrator (Right) -->
  <g transform="translate(830, 200)" filter="url(#shadow)">
    <rect width="130" height="200" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" />
    <rect width="130" height="32" rx="8" fill="#FFEDD5" />
    <text x="65" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#9A3412" text-anchor="middle">[External Entity]</text>
    <text x="65" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#C2410C" text-anchor="middle">Campus Admin</text>
    <text x="65" y="84" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">(Staff Reviewer)</text>
    <line x1="15" y1="100" x2="115" y2="100" stroke="#FED7AA" stroke-width="1"/>
    <text x="65" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">• Review Clues</text>
    <text x="65" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">• Compare Proof</text>
    <text x="65" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">• Accept / Reject</text>
  </g>

  <!-- Connectors from User to 1.0, 2.0, 3.0 -->
  <path d="M 160 210 L 238 140" fill="none" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="180" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#1F4E79">Item details + clue</text>

  <path d="M 160 270 L 238 270" fill="none" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="175" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#1F4E79">Search query</text>

  <path d="M 238 310 L 160 310" fill="none" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="175" y="325" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#1F4E79">Public list</text>

  <path d="M 160 370 L 238 430" fill="none" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="175" y="415" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#1F4E79">Claim form</text>

  <!-- Process to Data Stores -->
  <path d="M 338 140 L 428 175" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="350" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#166534">Save Item</text>

  <path d="M 428 200 L 338 260" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="350" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#166534">Read Items</text>

  <path d="M 338 440 L 428 425" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="350" y="450" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#166534">Store Claim</text>

  <!-- From Data Stores to 4.0 -->
  <path d="M 590 190 L 678 260" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="600" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#166534">Fetch Private Clue</text>

  <path d="M 590 410 L 678 310" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="600" y="375" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#166534">Fetch Pending Claim</text>

  <!-- Process 4.0 to Admin -->
  <path d="M 778 270 L 828 270" fill="none" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow-orange)" />
  <text x="785" y="260" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#C2410C">Queue &amp; Clue</text>

  <path d="M 828 310 L 778 310" fill="none" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow-orange)" />
  <text x="785" y="325" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#C2410C">Accept/Reject</text>

  <!-- 4.0 to 5.0 -->
  <path d="M 730 338 L 730 418" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="735" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#166534">Trigger Resolve</text>

  <!-- 5.0 back to D1 and D2 -->
  <path d="M 680 470 L 592 430" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="590" y="470" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#166534">Update Claims (Accept / Reject)</text>

  <path d="M 680 440 C 600 440, 560 300, 530 220" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="475" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#166534">Mark Item RESOLVED</text>

  <!-- Bottom Legend / Note -->
  <rect x="180" y="565" width="620" height="35" rx="6" fill="#F1F5F9" stroke="#E2E8F0" />
  <text x="490" y="587" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
    Key Assurance: Clues pass exclusively via Process 1.0 -> D1 -> Process 4.0 (Admin Review) and are isolated from Process 2.0.
  </text>
</svg>