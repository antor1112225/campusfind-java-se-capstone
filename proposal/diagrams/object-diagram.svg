<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F4E79" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#F8FAFC" />

  <!-- Header -->
  <text x="490" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">
    UML Object Diagram — Prototype Runtime Instance Snapshot
  </text>
  <text x="490" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">
    Concrete Object Instances, Fictional Demonstration Data, and Claim Verification Linkage
  </text>

  <!-- Object 1: appWindow : MainFrame (Top Left) -->
  <g transform="translate(50, 80)" filter="url(#shadow)">
    <rect width="260" height="95" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.8" />
    <path d="M 0 6 Q 0 0 6 0 L 254 0 Q 260 0 260 6 L 260 26 L 0 26 Z" fill="#D9E1F2" />
    <text x="130" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" text-decoration="underline" fill="#1F4E79" text-anchor="middle">
      <u>appWindow : MainFrame</u>
    </text>
    <line x1="0" y1="26" x2="260" y2="26" stroke="#1F4E79" stroke-width="1" />
    <g font-family="'Courier New', monospace" font-size="10.5" fill="#334155">
      <text x="10" y="46">title = "CampusFind System"</text>
      <text x="10" y="64">activeTab = 3 (Admin Review)</text>
      <text x="10" y="82">visible = true</text>
    </g>
  </g>

  <!-- Object 2: service : RecoveryService (Top Center) -->
  <g transform="translate(360, 80)" filter="url(#shadow)">
    <rect width="260" height="95" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <path d="M 0 6 Q 0 0 6 0 L 254 0 Q 260 0 260 6 L 260 26 L 0 26 Z" fill="#0284C7" />
    <text x="130" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" text-decoration="underline" fill="#FFFFFF" text-anchor="middle">
      <u>service : RecoveryService</u>
    </text>
    <line x1="0" y1="26" x2="260" y2="26" stroke="#0284C7" stroke-width="1" />
    <g font-family="'Courier New', monospace" font-size="10.5" fill="#334155">
      <text x="10" y="46">items.size() = 4</text>
      <text x="10" y="64">claims.size() = 2</text>
      <text x="10" y="82">status = "Initialized"</text>
    </g>
  </g>

  <!-- Object 3: storage : FileStorage (Top Right) -->
  <g transform="translate(670, 80)" filter="url(#shadow)">
    <rect width="260" height="95" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8" />
    <path d="M 0 6 Q 0 0 6 0 L 254 0 Q 260 0 260 6 L 260 26 L 0 26 Z" fill="#16A34A" />
    <text x="130" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" text-decoration="underline" fill="#FFFFFF" text-anchor="middle">
      <u>storage : FileStorage</u>
    </text>
    <line x1="0" y1="26" x2="260" y2="26" stroke="#16A34A" stroke-width="1" />
    <g font-family="'Courier New', monospace" font-size="10" fill="#334155">
      <text x="10" y="46">dataDirectory = "data"</text>
      <text x="10" y="64">itemsFilePath = "data/items.csv"</text>
      <text x="10" y="82">claimsFilePath = "data/claims.csv"</text>
    </g>
  </g>

  <!-- Connectors among top objects -->
  <line x1="310" y1="127" x2="355" y2="127" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="620" y1="127" x2="665" y2="127" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Object 4: backpack : Item (Bottom Left) -->
  <g transform="translate(50, 230)" filter="url(#shadow)">
    <rect width="410" height="340" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 402 0 Q 410 0 410 8 L 410 32 L 0 32 Z" fill="#0284C7" />
    <text x="205" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="bold" text-decoration="underline" fill="#FFFFFF" text-anchor="middle">
      <u>backpack : Item</u>
    </text>
    <line x1="0" y1="32" x2="410" y2="32" stroke="#0284C7" stroke-width="1" />

    <g font-family="'Courier New', monospace" font-size="10.5" fill="#1E293B">
      <text x="12" y="55">itemId = "ITM-101"</text>
      <text x="12" y="78">itemType = "FOUND"</text>
      <text x="12" y="101">title = "Blue Dell Laptop Backpack"</text>
      <text x="12" y="124">category = "Bags"</text>
      <text x="12" y="147">publicDescription = "Dark blue backpack found</text>
      <text x="160" y="165">on 2nd floor library near table 4"</text>
      <text x="12" y="188">location = "Campus Library 2nd Floor"</text>
      <text x="12" y="211">reportDate = "2026-10-25"</text>
      <text x="12" y="234">contactInfo = "library-desk@campus.edu"</text>

      <!-- Private Clue Highlight -->
      <rect x="6" y="246" width="398" height="50" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
      <text x="12" y="264" font-weight="bold" fill="#B45309">privateClue = "Contains a silver 16GB</text>
      <text x="12" y="284" font-weight="bold" fill="#B45309">flash drive with an anime sticker"</text>

      <text x="12" y="322">itemStatus = "OPEN"</text>
    </g>
  </g>

  <!-- Object 5: claim1 : Claim (Bottom Right) -->
  <g transform="translate(520, 230)" filter="url(#shadow)">
    <rect width="410" height="340" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 402 0 Q 410 0 410 8 L 410 32 L 0 32 Z" fill="#EA580C" />
    <text x="205" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="bold" text-decoration="underline" fill="#FFFFFF" text-anchor="middle">
      <u>claim1 : Claim</u>
    </text>
    <line x1="0" y1="32" x2="410" y2="32" stroke="#EA580C" stroke-width="1" />

    <g font-family="'Courier New', monospace" font-size="10.5" fill="#1E293B">
      <text x="12" y="55">claimId = "CLM-501"</text>
      <text x="12" y="78" font-weight="bold" fill="#1E40AF">itemId = "ITM-101" (references backpack)</text>
      <text x="12" y="101">claimantName = "Alex Rivera"</text>
      <text x="12" y="124">claimantContact = "arivera@student.univ.edu"</text>
      <text x="12" y="147">submissionDate = "2026-10-27"</text>

      <!-- Claimant Answer Highlight -->
      <rect x="6" y="160" width="398" height="66" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
      <text x="12" y="180" font-weight="bold" fill="#B45309">ownershipAnswer = "My backpack has my</text>
      <text x="12" y="200" font-weight="bold" fill="#B45309">silver 16GB USB drive with an anime</text>
      <text x="12" y="218" font-weight="bold" fill="#B45309">sticker and blue hydroflask inside."</text>

      <text x="12" y="248">claimStatus = "PENDING"</text>
      <text x="12" y="271">reviewNotes = ""</text>
    </g>

    <!-- Annotation badge inside Claim box -->
    <rect x="12" y="295" width="386" height="32" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
    <text x="205" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">
      Status: Ready for Side-by-Side Review &amp; Handover
    </text>
  </g>

  <!-- Connectors from Service to instances -->
  <path d="M 430 175 C 430 200, 255 190, 255 225" fill="none" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="320" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#0284C7">items[0]</text>

  <path d="M 550 175 C 550 200, 725 190, 725 225" fill="none" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="645" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#EA580C">claims[0]</text>

  <!-- Link between Claim and Item -->
  <line x1="520" y1="310" x2="465" y2="310" stroke="#1F4E79" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="492" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#1F4E79" text-anchor="middle">itemId="ITM-101"</text>

  <!-- Verification Match Banner -->
  <rect x="100" y="595" width="780" height="48" rx="6" fill="#F1F5F9" stroke="#CBD5E1" />
  <text x="490" y="616" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E3A8A" text-anchor="middle">
    Snapshot Evidence of Private Claim Verification:
  </text>
  <text x="490" y="632" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">
    claim1.ownershipAnswer ("silver 16GB USB drive with anime sticker") exactly corroborates backpack.privateClue, proving ownership before administrative approval.
  </text>
</svg>