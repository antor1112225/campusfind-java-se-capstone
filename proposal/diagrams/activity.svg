<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 920" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E3A8A" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#166534" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991B1B" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#F8FAFC" />

  <!-- Diagram Title -->
  <text x="490" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">
    Activity Diagram — Claim Submission, Verification &amp; Resolution
  </text>
  <text x="490" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">
    Swimlanes: Campus Claimant (User) and Campus Administrator (Reviewer) Workflows
  </text>

  <!-- Swimlane 1: Campus Claimant -->
  <rect x="50" y="75" width="430" height="825" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="50" y="75" width="430" height="34" fill="#DBEAFE" />
  <text x="265" y="97" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">
    Swimlane: Campus Claimant (Student / Staff)
  </text>

  <!-- Swimlane 2: Campus Administrator -->
  <rect x="490" y="75" width="440" height="825" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="490" y="75" width="440" height="34" fill="#FFEDD5" />
  <text x="710" y="97" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2410C" text-anchor="middle">
    Swimlane: Campus Administrator (Reviewer)
  </text>

  <!-- ================= USER ACTIVITIES ================= -->
  <!-- Start Node -->
  <circle cx="265" cy="140" r="14" fill="#1E3A8A" />
  <line x1="265" y1="154" x2="265" y2="185" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Act 1: Browse Public Catalog -->
  <g transform="translate(145, 185)" filter="url(#shadow)">
    <rect width="240" height="42" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8" />
    <text x="120" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#0C4A6E" text-anchor="middle">Browse Public Item Catalog</text>
  </g>
  <line x1="265" y1="227" x2="265" y2="255" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Act 2: Select Found Item -->
  <g transform="translate(145, 255)" filter="url(#shadow)">
    <rect width="240" height="42" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8" />
    <text x="120" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#0C4A6E" text-anchor="middle">Select Found Item &amp; Click Claim</text>
  </g>
  <line x1="265" y1="297" x2="265" y2="325" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Act 3: Fill Form & Secret Detail -->
  <g transform="translate(145, 325)" filter="url(#shadow)">
    <rect width="240" height="48" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8" />
    <text x="120" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0C4A6E" text-anchor="middle">Enter Name, Contact &amp;</text>
    <text x="120" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0369A1" text-anchor="middle">Ownership Secret Proof</text>
  </g>
  <line x1="265" y1="373" x2="265" y2="405" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision 1: Input Valid? -->
  <g transform="translate(265, 430)">
    <polygon points="0,-22 45,0 0,22 -45,0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" />
    <text x="0" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#78350F" text-anchor="middle">Valid?</text>
  </g>

  <!-- Loop back on invalid -->
  <path d="M 220 430 L 95 430 L 95 350 L 145 350" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <text x="110" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">No (Alert)</text>

  <!-- Forward on valid -->
  <line x1="265" y1="452" x2="265" y2="495" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="275" y="475" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#166534">Yes</text>

  <!-- Act 4: Save & Queue Claim -->
  <g transform="translate(145, 495)" filter="url(#shadow)">
    <rect width="240" height="48" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8" />
    <text x="120" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14532D" text-anchor="middle">Save Claim (Status: PENDING)</text>
    <text x="120" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#166534" text-anchor="middle">Show Confirmation to User</text>
  </g>

  <!-- Cross-lane flow from User to Admin -->
  <path d="M 385 519 L 585 519" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <text x="485" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E3A8A" text-anchor="middle">Queued to Admin</text>

  <!-- ================= ADMIN ACTIVITIES ================= -->
  <!-- Act 5: Admin Opens Review -->
  <g transform="translate(585, 495)" filter="url(#shadow)">
    <rect width="250" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.8" />
    <text x="125" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7C2D12" text-anchor="middle">Select Pending Claim from Table</text>
    <text x="125" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#9A3412" text-anchor="middle">Load Target Item &amp; Claim Details</text>
  </g>
  <line x1="710" y1="543" x2="710" y2="575" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Act 6: Side-by-Side Verification -->
  <g transform="translate(585, 575)" filter="url(#shadow)">
    <rect width="250" height="52" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
    <text x="125" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#78350F" text-anchor="middle">Side-by-Side Comparison Box</text>
    <text x="125" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#92400E" text-anchor="middle">Founder's Clue vs. Claimant Proof</text>
    <text x="125" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#92400E" text-anchor="middle">(Confidential Staff Review)</text>
  </g>
  <line x1="710" y1="627" x2="710" y2="660" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision 2: Clue Matches? -->
  <g transform="translate(710, 685)">
    <polygon points="0,-25 55,0 0,25 -55,0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" />
    <text x="0" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#78350F" text-anchor="middle">Match?</text>
  </g>

  <!-- Left Branch: Accept (Green) -->
  <line x1="655" y1="685" x2="570" y2="685" stroke="#16A34A" stroke-width="2" />
  <line x1="570" y1="685" x2="570" y2="735" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="590" y="675" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#166534">Yes (Match)</text>

  <!-- Right Branch: Reject (Red) -->
  <line x1="765" y1="685" x2="850" y2="685" stroke="#DC2626" stroke-width="2" />
  <line x1="850" y1="685" x2="850" y2="735" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="810" y="675" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">No (Mismatch)</text>

  <!-- Act 7A: Accept Flow -->
  <g transform="translate(495, 735)" filter="url(#shadow)">
    <rect width="180" height="66" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8" />
    <text x="90" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#14532D" text-anchor="middle">Accept Claim</text>
    <text x="90" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#166534" text-anchor="middle">• Status = ACCEPTED</text>
    <text x="90" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#166534" text-anchor="middle">• Item = RESOLVED</text>
    <text x="90" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#166534" text-anchor="middle">• Competing Claims Auto-Closed</text>
  </g>

  <!-- Act 7B: Reject Flow -->
  <g transform="translate(745, 735)" filter="url(#shadow)">
    <rect width="175" height="66" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8" />
    <text x="87" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#7F1D1D" text-anchor="middle">Reject Claim</text>
    <text x="87" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#991B1B" text-anchor="middle">• Status = REJECTED</text>
    <text x="87" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#991B1B" text-anchor="middle">• Record Reason Notes</text>
    <text x="87" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#991B1B" text-anchor="middle">• Item Remains OPEN</text>
  </g>

  <!-- Connect to Final End Nodes -->
  <line x1="585" y1="801" x2="585" y2="835" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
  <line x1="832" y1="801" x2="832" y2="835" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- End Node 1 (Accept Handover) -->
  <g transform="translate(585, 850)">
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#166534" stroke-width="2.5" />
    <circle cx="0" cy="0" r="8" fill="#166534" />
    <text x="0" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">Handover Ready</text>
  </g>

  <!-- End Node 2 (Rejection Finished) -->
  <g transform="translate(832, 850)">
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#991B1B" stroke-width="2.5" />
    <circle cx="0" cy="0" r="8" fill="#991B1B" />
    <text x="0" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#991B1B" text-anchor="middle">Claim Dismissed</text>
  </g>
</svg>