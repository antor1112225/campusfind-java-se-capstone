<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <filter id="win-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#E2E8F0" />

  <!-- Swing Window Frame -->
  <g transform="translate(30, 25)" filter="url(#win-shadow)">
    <rect width="860" height="570" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />

    <!-- OS Window Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 852 0 Q 860 0 860 8 L 860 32 L 0 32 Z" fill="#1E293B" />
    <text x="20" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">
      CampusFind — Campus Lost-and-Found System with Private Claim Verification
    </text>
    <circle cx="800" cy="16" r="6" fill="#FBBF24" />
    <circle cx="820" cy="16" r="6" fill="#34D399" />
    <circle cx="840" cy="16" r="6" fill="#F87171" />

    <!-- Top Banner -->
    <rect x="0" y="32" width="860" height="55" fill="#182B49" />
    <text x="20" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">
      CampusFind — University Lost &amp; Found
    </text>

    <!-- Swing Tabs -->
    <g transform="translate(10, 95)">
      <!-- Tab 3: Active -->
      <path d="M 364 5 Q 364 0 369 0 L 499 0 Q 504 0 504 5 L 504 30 L 364 30 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="434" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284C7" text-anchor="middle">
        3. Submit Claim
      </text>
    </g>

    <!-- Tab 3 Body Content -->
    <rect x="10" y="125" width="840" height="415" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />

    <!-- Claim Form Container -->
    <g transform="translate(35, 140)">
      <rect width="790" height="385" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="20" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">
        File an Ownership Claim Against a Found Campus Item
      </text>

      <text x="25" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#334155">Found Item ID:*</text>
      <rect x="210" y="44" width="160" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" />
      <text x="220" y="61" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E40AF">ITM-101</text>

      <!-- Target Item Preview -->
      <rect x="210" y="76" width="540" height="26" rx="4" fill="#F0FDF4" stroke="#86EFAC" />
      <text x="220" y="93" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">
        Target Found: [ITM-101] Blue Dell Laptop Backpack at Campus Library 2nd Floor (Status: OPEN)
      </text>

      <!-- 4. Ownership Proof -->
      <g transform="translate(20, 195)">
        <rect width="750" height="115" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
        <text x="15" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#92400E">
          Ownership Proof / Secret Clue:*
        </text>
        <rect x="190" y="10" width="545" height="55" rx="4" fill="#FFFFFF" stroke="#FCD34D" />
        <text x="200" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#78350F">
          My backpack has my silver 16GB USB drive with an anime sticker and blue hydroflask inside.
        </text>
      </g>
    </g>

    <!-- Swing Bottom Status Bar -->
    <rect x="0" y="540" width="860" height="30" fill="#F1F5F9" stroke="#E2E8F0" />
    <text x="15" y="559" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569">
      Claim form ready. Enter Item ID and secret verification detail.
    </text>
  </g>
</svg>